# Docker Compose for local development/testing
version: '3.8'

services:
  apex-registry:
    build: .
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4000
      - DATABASE_PATH=/app/data/apex.db
      - STORAGE_PATH=/app/data/packages
      - JWT_SECRET=change-this-in-production-to-a-long-random-string
      - LOG_LEVEL=info
      - CORS_ORIGINS=*
    volumes:
      - apex-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  apex-data:
