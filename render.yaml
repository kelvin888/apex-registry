# Render Blueprint - https://render.com/docs/blueprint-spec
services:
  - type: web
    name: apex-registry
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node dist/cli.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 4000
      - key: DATABASE_PATH
        value: /var/data/apex.db
      - key: STORAGE_PATH
        value: /var/data/packages
      - key: JWT_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: info
    disk:
      name: apex-data
      mountPath: /var/data
      sizeGB: 1
